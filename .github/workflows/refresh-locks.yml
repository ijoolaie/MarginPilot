name: Refresh backend lock files

on:
  push:
    branches:
      - phase2-step1-ci-warnings

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pinned lock compiler
        run: python -m pip install pip-tools==7.5.3
      - name: Compile runtime lock
        working-directory: backend
        run: pip-compile --generate-hashes --output-file=requirements-runtime.lock pyproject.toml
      - name: Compile full lock
        working-directory: backend
        run: pip-compile --all-extras --generate-hashes --output-file=requirements.lock pyproject.toml
      - uses: actions/upload-artifact@v7
        with:
          name: refreshed-backend-locks
          path: |
            backend/requirements.lock
            backend/requirements-runtime.lock
          if-no-files-found: error
          retention-days: 1
