[project]
name = "marginpilot-backend"
version = "0.1.0"
description = "MarginPilot backend — FastAPI modular monolith (Phase 2 / Step 1: infrastructure foundation only)"
requires-python = ">=3.12,<3.13"
# Exact pins per docs/dependencies.md (Phase 2 compatibility matrix).
# Transitive dependencies are resolved + hashed into requirements.lock.
dependencies = [
    "fastapi==0.163.1",
    "uvicorn==0.54.0",
    "pydantic==2.12.5",
    # 2.13.1 (registry latest 2026-11-16) rejected: CVE-2026-58203 (pip-audit)
    # -> security-first bump to the listed fix version 2.14.2.
    "pydantic-settings==2.14.2",
    "SQLAlchemy==2.1.8",
    "alembic==1.20.1",
    "psycopg==3.3.9",
    "psycopg-binary==3.3.9",
]

[project.optional-dependencies]
dev = [
    # 9.0.2 rejected: PYSEC-2026-1845 (pip-audit) -> fix version 9.0.3.
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.0.0",
    "httpx2==2.16.2",
    "ruff==0.17.5",
    "mypy==2.4.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM"]
ignore = [
    "B008", # FastAPI Depends() in argument defaults is the framework idiom
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
# TestClient/httpx and pytest fixtures: keep pragmatism where third-party
# typing is incomplete, without weakening app-code strictness.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = ["uvicorn.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration' -q"
markers = [
    "integration: requires a real PostgreSQL via DATABASE_URL (run with -m integration)",
]
asyncio_mode = "strict"
